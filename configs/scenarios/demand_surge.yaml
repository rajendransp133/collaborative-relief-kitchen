extends: base.yaml
name: Demand surge
description: >
  README events 2 and 7: Shelter A reports 80 more people and an urgent medical order arrives.
  Higher-priority work is scheduled first; whatever no longer fits is rejected with the shared
  resource (staff, stoves, vehicles) and the deadline that cause it.
events:
  - {kind: demand_surge, order: O2, extra: 80, label: "Shelter A reports 80 more people"}
  - kind: add_order
    label: "Urgent order: 60 soft meals for the hospital by 10:40"
    order: {id: O4, destination: hospital, meals: 60, diet: [soft], deadline: "10:40", priority: 3}
  - kind: add_order
    label: "Stadium Shelter C asks for 120 meals by 11:30"
    order: {id: O5, destination: shelter_c, meals: 120, diet: [], deadline: "11:30", priority: 1}
